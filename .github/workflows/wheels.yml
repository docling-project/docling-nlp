on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        description: "If true, the packages will be published."
        default: false

concurrency:
  # never cancel a publishing run
  group: wheels-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.publish }}
  cancel-in-progress: ${{ !inputs.publish }}

env:
  CMAKE_BUILD_TYPE: Release
  # fasttext/sentencepiece still declare cmake_minimum_required(VERSION <3.5), which
  # CMake 4.x refuses. The env var (unlike -D) propagates into the ExternalProject
  # sub-configures, which is where the failure actually happens.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  # `uv run` re-syncs by default and, because [tool.uv] sets package = true, that
  # builds+installs the project on the host. On linux this leaves a build/CMakeCache.txt
  # pinned to the host path, which cibuildwheel then copies into the container as /project
  # -> "current CMakeCache.txt directory is different than the directory where it was created".
  UV_NO_SYNC: "1"

jobs:
  build_sdist:
    name: Build sdist artifacts
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
      - name: Build sdist
        run: |
          uv build --sdist
          ls ./dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-sdist
          path: dist/

  build_wheels:
    name: Build wheel for py${{ matrix.python-version }} ${{ matrix.os.platform_id }}
    runs-on: ${{ matrix.os.name }}

    strategy:
      # Ensure that a wheel builder finishes even if another fails
      # list of github vm: https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

        os:
          - name: "ubuntu-24.04"
            platform: "linux"
            platform_id: "manylinux_x86_64"

          # native arm64 runner: aarch64 wheels used to be cross-built on the
          # x86_64 runner under QEMU, which is what made these jobs take ~1h
          - name: "ubuntu-24.04-arm"
            platform: "linux"
            platform_id: "manylinux_aarch64"

          - name: "macos-14"
            platform: "macos"
            min_macos_version: "14"
            platform_id: "macosx_arm64"

          - name: "windows-2025"
            platform: "windows"
            platform_id: "win_amd64"

          - name: "windows-11-arm"
            platform: "windows"
            platform_id: "win_arm64"

        # win_arm64 wheels start at 3.12. Below that there is no native ARM64
        # CPython on the runner, so cibuildwheel would cross-compile from an
        # amd64 host and pybind11 would need the DIST_EXTRA_CONFIG -> FindPython
        # bridge to link against the target's pythonXY.lib. Deliberately not
        # supported: 3.10/3.11 get no win_arm64 wheel.
        # NOTE: matrix excludes do not partial-match nested objects, so the whole
        # os entry has to be repeated here.
        exclude:
          - python-version: "3.10"
            os:
              name: "windows-11-arm"
              platform: "windows"
              platform_id: "win_arm64"
          - python-version: "3.11"
            os:
              name: "windows-11-arm"
              platform: "windows"
              platform_id: "win_arm64"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        id: py
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up custom PATH and set py version to cpXYZ [windows]
        if: ${{matrix.os.platform == 'windows'}}
        shell: pwsh
        run: |
          # MSYS2/MinGW is only used for the amd64 build; arm64 goes via MSVC and
          # must not pick a gcc off PATH.
          if ("${{ matrix.os.platform_id }}" -eq "win_amd64") {
              echo "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              echo "C:\nasm" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          echo "C:\Users\runneradmin\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $version = "${{ matrix.python-version }}"
          $cp_version = "cp$($version -replace '\.', '')"
          Add-Content -Path $env:GITHUB_ENV -Value "python_cp_version=$cp_version"

      - name: Convert python version to cpXYZ
        if: ${{matrix.os.platform != 'windows'}}
        run: |
          version=${{ matrix.python-version }}
          cp_version="cp${version//.}"
          echo "python_cp_version=$cp_version" >> $GITHUB_ENV

      # there is an error with the tagging of wheels for macosx-arm64
      # see note: https://cibuildwheel.readthedocs.io/en/stable/faq/
      # see here: https://gist.github.com/anderssonjohan/49f07e33fc5cb2420515a8ac76dc0c95#file-build-pendulum-wheels-yml-L39-L53
      - name: Build wheels [macos-arm64]
        if: ${{matrix.os.platform_id == 'macosx_arm64'}}
        env:
          CIBW_BUILD: ${{ env.python_cp_version }}-${{ matrix.os.platform_id }}
          CIBW_ARCHS: arm64
          CIBW_ARCHS_MACOS: arm64
          CIBW_PLATFORM: macos
          CIBW_SKIP: "pp* *-musllinux_* *_i686* *x86_64* *_s390* *pypy*"
          CIBW_PROJECT_REQUIRES_PYTHON: "~=${{ matrix.python-version }}.0"
          CIBW_BUILD_VERBOSITY: 3
          CMAKE_OSX_ARCHITECTURES: arm64
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: ""  # do not run delocate-wheel before the re-tag
          CIBW_ENVIRONMENT: "MACOSX_DEPLOYMENT_TARGET=${{ matrix.os.min_macos_version }}.0 CMAKE_POLICY_VERSION_MINIMUM=3.5"
          ARCHFLAGS: -arch arm64
          BUILD_THREADS: "4"
          PYTORCH_MPS_HIGH_WATERMARK_RATIO: "0.0"
          CUDA_VISIBLE_DEVICES: "cpu"
        run: |
          uv sync --no-default-groups --no-install-project --group build
          rm -rf ./build || true
          PY_CACHE_TAG=$(uv run python -c 'import sys;print(sys.implementation.cache_tag)')
          echo "Building wheel ${CIBW_BUILD} ${{ env.CIBW_BUILD }}"
          echo "Building cp: ${{ env.python_cp_version }}"
          echo "Building cache_tag: ${PY_CACHE_TAG}"
          echo "Building platform_id: ${{ matrix.os.platform_id }}"
          uv run python --version
          uv run python --version | grep ${{ matrix.python-version }} 
          cat ./pyproject.toml
          uv run python -m cibuildwheel --output-dir wheelhouse
          echo "step 1"
          ls -l wheelhouse
          uv run wheel tags --remove --platform-tag macosx_${{ matrix.os.min_macos_version }}_0_arm64 ./wheelhouse/*.whl
          rm -f ./wheelhouse/*x86_64.whl
          echo "step 2"
          ls -l wheelhouse
          uv run delocate-wheel --require-archs arm64 -v ./wheelhouse/*.whl
          echo "step 3"
          ls -l wheelhouse
          for file in ./wheelhouse/*.whl; do
            echo "Inspecting $file"
            uv run python -m zipfile --list "$file"
            echo "Checking if .so is contained in the wheel"
            uv run python -m zipfile --list "$file" | grep \\.so
            echo "Checking if the correct python version is contained in the wheel"
            uv run python -m zipfile --list "$file" | grep ${PY_CACHE_TAG}
          done
          mkdir -p ./dist
          cp wheelhouse/*.whl ./dist/

      # No QEMU step: both linux runners are native for their own arch, and
      # CIBW_BUILD below pins each job to exactly one build identifier.

      - name: Build wheels [linux]
        if: startsWith(matrix.os.name, 'ubuntu')
        env:
          # Pin to this matrix entry only. Previously commented out, which made
          # every linux job build x86_64 *and* emulated aarch64.
          CIBW_BUILD: ${{ env.python_cp_version }}-${{ matrix.os.platform_id }}
          CIBW_ARCHS: auto
          CIBW_PLATFORM: linux
          CIBW_SKIP: "pp* *musllinux_* *_i686* *_s390* *pypy*"
          CIBW_PROJECT_REQUIRES_PYTHON: "~=${{ matrix.python-version }}.0"
          CIBW_BUILD_VERBOSITY: 3
          # env vars do not cross into the manylinux container; CIBW_ENVIRONMENT does
          CIBW_ENVIRONMENT: "CMAKE_POLICY_VERSION_MINIMUM=3.5"
          # belt-and-braces: never ship a host-generated cmake cache into /project
          CIBW_BEFORE_BUILD: "rm -rf /project/build"
          # without this BUILD_THREADS never reaches the container and the build
          # falls back to local_build.py's default of 4
          CIBW_ENVIRONMENT_PASS_LINUX: "BUILD_THREADS"
          BUILD_THREADS: "8"
        run: |
          uv sync --no-default-groups --no-install-project --group build
          rm -rf ./build
          PY_CACHE_TAG=$(uv run python -c 'import sys;print(sys.implementation.cache_tag)')
          echo "Building cp: ${{ env.python_cp_version }}"
          echo "Building cache_tag: ${PY_CACHE_TAG}"
          echo "Building platform_id: ${{ matrix.os.platform_id }}"
          uv run python --version
          uv run python --version | grep ${{ matrix.python-version }} 
          cat ./pyproject.toml
          uv run python -m cibuildwheel --output-dir ./wheelhouse
          ls -l ./wheelhouse
          for file in ./wheelhouse/*.whl; do
            echo "Inspecting $file"
            uv run python -m zipfile --list "$file"
            echo "Checking if .so is contained in the wheel"
            uv run python -m zipfile --list "$file" | grep \\.so
            echo "Checking if the correct python version is contained in the wheel"
            uv run python -m zipfile --list "$file" | grep ${PY_CACHE_TAG}
          done
          mkdir -p ./dist
          cp wheelhouse/*.whl ./dist/

      - name: Set up MSYS2 [windows amd64]
        if: ${{matrix.os.platform_id == 'win_amd64'}}
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gcc-libs

      - name: Set up external-libs [windows amd64]
        if: ${{matrix.os.platform_id == 'win_amd64'}}
        shell: pwsh
        run: |
          Copy-Item -Path "C:/mingw64/bin/libgcc_s_seh-1.dll" -Destination ".\docling_nlp"
          Copy-Item -Path "C:/mingw64/bin/libstdc++-6.dll" -Destination ".\docling_nlp"
          Copy-Item -Path "C:/mingw64/bin/libwinpthread-1.dll" -Destination ".\docling_nlp"

      - name: Set up build env [windows]
        if: ${{ matrix.os.platform == 'windows' }}
        shell: pwsh
        run: |
          if ("${{ matrix.os.platform_id }}" -eq "win_amd64") {
              # MinGW/gcc via MSYS2, as before
              Add-Content -Path $env:GITHUB_ENV -Value "CIBW_ARCHS=AMD64"
              Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG_PATH=C:/msys64/usr/lib/pkgconfig"
              Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG_EXECUTABLE=C:/mingw64/bin/pkg-config.exe"
              Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_PREFIX_PATH=C:/msys64/mingw64;C:/mingw64"
              Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_LIBRARY_PATH=C:/msys64/mingw64/lib;C:/mingw64/lib"
              Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_INCLUDE_PATH=C:/msys64/mingw64/include;C:/mingw64/include"
              Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_GENERATOR=MSYS Makefiles"
          }
          else {
              # There is no MinGW aarch64 toolchain on the runner, so arm64 goes
              # through MSVC. -A ARM64 selects the target platform for the
              # Visual Studio generator; local_build.py forwards both.
              Add-Content -Path $env:GITHUB_ENV -Value "CIBW_ARCHS=ARM64"
              Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_GENERATOR=Visual Studio 17 2022"
              Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_ARGS=-A ARM64"
          }
          # NOTE: docling-parse also exports
          #   PYTHON_MODULE_EXTENSION=${SETUPTOOLS_EXT_SUFFIX}
          # here. That is only meaningful while cross-compiling, since
          # cibuildwheel sets SETUPTOOLS_EXT_SUFFIX in that mode alone; on a
          # native build it would export the literal, unexpanded string. We build
          # win_arm64 natively (3.12+ only), so it is deliberately omitted.

      - name: Build wheels [windows]
        if: ${{ matrix.os.platform == 'windows' }}
        env:
          CIBW_PLATFORM: windows
          CIBW_BUILD_VERBOSITY: 3
          CIBW_BUILD: ${{ env.python_cp_version }}-${{ matrix.os.platform_id }}
          CIBW_SKIP: "pp*"
          CIBW_PROJECT_REQUIRES_PYTHON: "~=${{ matrix.python-version }}.0"
          CIBW_ENVIRONMENT: "CMAKE_POLICY_VERSION_MINIMUM=3.5"
          BUILD_THREADS: 1
        shell: pwsh
        run: |
          # Strawberry Perl shadows tools the build needs; it is not present on
          # the arm64 image, so guard the removal.
          if (Test-Path "C:\Strawberry\") {
              Remove-Item -Recurse -Force "C:\Strawberry\"
          }
          uv sync --no-default-groups --no-install-project --group build
          if (Test-Path ".\build") {
              Remove-Item -Recurse -Force ".\build"
          }
          uv run python -m cibuildwheel --output-dir .\wheelhouse
          Get-ChildItem -Path .\wheelhouse -Filter *.whl | Format-List
          Get-ChildItem -Path .\wheelhouse -Filter *.whl | ForEach-Object {
              $file = $_.FullName
              Write-Output "Inspecting $file"
              uv run python -m zipfile --list "$file"
          }
          if (-not (Test-Path -Path .\dist)) {
              New-Item -Path .\dist -ItemType Directory
          }
          Copy-Item -Path .\wheelhouse\*.whl -Destination .\dist\

      - name: Test wheel
        if: ${{ matrix.os.platform == 'windows' || matrix.os.platform_id == 'macosx_arm64' }}
        shell: bash
        run: |
          # Order matters. `uv sync` makes the venv match the lockfile exactly,
          # so installing the wheel first just gets it removed again
          # ("Uninstalled 1 package") and the tests then import nothing.
          uv sync --no-default-groups --group test --no-install-project
          wheel_file=$(ls dist/*.whl | head -n 1)
          uv pip install "$wheel_file"
          # Resolve the venv interpreter and run the import check from outside
          # the repo: with the source tree as cwd, ./docling_nlp shadows the
          # installed wheel and this check could never fail.
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python.exe; fi
          PY_ABS="$(cd "$(dirname "$PY")" && pwd)/$(basename "$PY")"
          (cd "${RUNNER_TEMP}" && "$PY_ABS" -c "from docling_nlp import andromeda_glm; print('imported from', andromeda_glm.__file__)")
          # pytest does not put cwd on sys.path, so this exercises the wheel
          uv run --no-sync pytest ./tests/test_glm.py -v

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-py${{ matrix.python-version }}-${{ matrix.os.platform_id }}
          path: dist/

  publish-packages:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: inputs.publish && startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
      - build_sdist
      - build_wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/docling-nlp
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
      contents: write  # IMPORTANT: mandatory for adding artifacts to GitHub Releases
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/
      - name: List dist/
        run: |
          ls ./dist
      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          release-signing-artifacts: false
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
      - name: List dist/
        run: |
          ls ./dist
      - name: Upload artifact signatures to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Upload to GitHub Release using the `gh` CLI.
        # `dist/` contains the built packages, and the
        # sigstore-produced signatures and certificates.
        # --clobber: without it a re-run of this job (e.g. after the PyPI step
        # failed) dies here with "asset under the same name already exists",
        # before it ever reaches PyPI.
        run: >-
          gh release upload
          '${{ github.ref_name }}' dist/**
          --repo '${{ github.repository }}'
          --clobber
      # PyPI does not accept .sigstore artifacts and
      # gh-action-pypi-publish has no option to ignore them.
      - name: Remove sigstore signatures before uploading to PyPI
        run: rm ./dist/*.sigstore.json
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # currently not working with reusable workflows
          attestations: false
          # same idea as --clobber above: let a re-run finish the upload
          # instead of failing on the files that already made it through.
          skip-existing: true
